; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run -t upload` flashes the bench board. The real station: `pio run -e station -t upload`.
; Unit tests: `pio test -e native`.
default_envs = bench

; Shared by both boards. Not an env on its own. Device id, key and WiFi are not build
; settings: each board keeps its own in NVS, set with the setup portal.
[esp32_base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Two 1.9 MB app slots for OTA updates (the default table has 1.25 MB). Changing the
; partition table needs one USB flash; NVS stays at the same place, so settings survive.
board_build.partitions = min_spiffs.csv
lib_deps =
    adafruit/Adafruit BME280 Library
    adafruit/Adafruit Unified Sensor
    tzapu/WiFiManager@2.0.17
; All unit tests run in the native env, never on the board.
test_ignore = *

; Board on the desk: a live sensor line on serial every 10 s (readings are still one per
; minute). Its device id (meteo-station-bench) is set with the setup portal.
[env:bench]
extends = esp32_base
build_flags =
    -D LIVE_LOG_INTERVAL_MS=10000

; Boards mounted outside: the build OTA updates publish.
[env:station]
extends = esp32_base

; Runs pure-logic unit tests on the Mac, no board needed.
[env:native]
platform = native
test_framework = unity
