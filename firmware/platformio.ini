; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run -t upload` flashes the bench board. The real station: `pio run -e station -t upload`.
; Unit tests: `pio test -e native`.
default_envs = bench

; Shared by both boards. Not an env on its own.
[esp32_base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BME280 Library
    adafruit/Adafruit Unified Sensor
; All unit tests run in the native env, never on the board.
test_ignore = *

; Board on the desk: its own device_id, so test data never mixes with the station's,
; plus a live sensor line on serial every 10 s (readings are still one per minute).
[env:bench]
extends = esp32_base
build_flags =
    -D DEVICE_ID=\"meteo-station-bench\"
    -D LIVE_LOG_INTERVAL_MS=10000

; Board mounted outside.
[env:station]
extends = esp32_base
build_flags =
    -D DEVICE_ID=\"meteo-station-1\"

; Runs pure-logic unit tests on the Mac, no board needed.
[env:native]
platform = native
test_framework = unity
