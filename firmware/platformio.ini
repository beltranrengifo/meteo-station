; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` builds only the board. Unit tests: `pio test -e native`.
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BME280 Library
    adafruit/Adafruit Unified Sensor
; All unit tests run in the native env, never on the board.
test_ignore = *

; Runs pure-logic unit tests on the Mac, no board needed.
[env:native]
platform = native
test_framework = unity
