<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Inline, so a theme forced in the URL is on before the first paint: see src/lib/theme.ts. -->
    <script>
      const theme = new URLSearchParams(location.search).get('theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    </script>
    <title>Gorraplanistas · El tiempo en Las Rozas</title>
    <meta
      name="description"
      content="Una estación meteorológica casera en Las Rozas (Madrid): temperatura, sensación térmica, viento, lluvia y previsión, medidos aquí mismo y actualizados cada minuto."
    />
    <meta name="theme-color" content="#f5f7fb" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Gorraplanistas" />

    <!-- Link previews (WhatsApp, Telegram, X...). They need absolute URLs: the production domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="Gorraplanistas" />
    <meta property="og:url" content="https://gorraplanistas.vercel.app/" />
    <meta property="og:title" content="Gorraplanistas · El tiempo en Las Rozas" />
    <meta
      property="og:description"
      content="Una lectura tranquila de tu microclima: temperatura, viento, lluvia y previsión desde una estación casera en Las Rozas, minuto a minuto."
    />
    <meta property="og:image" content="https://gorraplanistas.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Gorraplanistas, Madrid · Las Rozas: una gorra con un sol y una nube, y el lema «Una lectura tranquila de tu microclima, minuto a minuto»." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
